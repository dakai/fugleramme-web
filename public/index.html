<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>鸟语 · Fugleramme</title>
    <style>
      :root {
        --paper: #efe7d6;
        --paper-2: #e5dac3;
        --ink: #2c2620;
        --ink-soft: #6b5f4d;
        --rule: #c9b997;
        --accent: #7c5b34;
        --card: #f7f1e4;
        color-scheme: light;
      }

      /* The illustration captions are handwritten, like the plates' own captions.
         Ma Shan Zheng (OFL, vendored) is the only CJK handwriting face guaranteed
         to exist offline; it carries Latin glyphs too, so one file covers both. */
      @font-face {
        font-family: "Ma Shan Zheng";
        src: url("/fonts/mashanzheng.woff2") format("woff2");
        font-weight: 400;
        font-display: swap;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background:
          radial-gradient(120% 90% at 50% -10%, #f6f0e2 0%, var(--paper) 45%, var(--paper-2) 100%);
        color: var(--ink);
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia,
          "Songti TC", "Noto Serif CJK TC", "Source Han Serif TC", serif;
        -webkit-font-smoothing: antialiased;
      }
      .sheet {
        max-width: 1500px;
        margin: 0 auto;
        padding: clamp(18px, 3vw, 48px);
        min-height: 100%;
        display: flex;
        flex-direction: column;
        gap: clamp(18px, 2.4vw, 32px);
      }
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        border-bottom: 1px solid var(--rule);
        padding-bottom: 14px;
      }
      h1 {
        font-size: clamp(28px, 4vw, 54px);
        margin: 0;
        font-weight: 500;
        letter-spacing: 0.04em;
      }
      h1 small {
        display: block;
        font-size: clamp(11px, 1.1vw, 15px);
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: var(--ink-soft);
        font-weight: 400;
        margin-top: 6px;
      }
      .meta { color: var(--ink-soft); font-size: clamp(12px, 1.2vw, 15px); text-align: right; }
      .meta b { color: var(--ink); font-weight: 600; }

      .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .toggle {
        display: inline-flex;
        border: 1px solid var(--ink);
        border-radius: 999px;
        overflow: hidden;
        background: var(--card);
      }
      .toggle button {
        font: inherit;
        font-size: clamp(12px, 1.2vw, 16px);
        padding: 8px 20px;
        border: 0;
        background: transparent;
        color: var(--ink-soft);
        cursor: pointer;
        letter-spacing: 0.08em;
      }
      .toggle button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
      select {
        font: inherit;
        font-size: clamp(12px, 1.2vw, 15px);
        padding: 7px 10px;
        border: 1px solid var(--rule);
        border-radius: 999px;
        background: var(--card);
        color: var(--ink);
      }

      main { flex: 1; }
      .grid {
        display: grid;
        gap: clamp(14px, 1.6vw, 26px);
        grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr));
        align-items: start;
      }
      .bird {
        background: var(--card);
        border: 1px solid var(--rule);
        border-radius: 6px;
        padding: 14px 16px 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        box-shadow: 0 1px 0 #fff8 inset, 0 8px 18px -18px #4b3d29;
      }
      .shot {
        aspect-ratio: 4 / 3;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f1e8d6;
        border-radius: 3px;
        overflow: hidden;
        position: relative;
      }
      .shot.plate { background: none; }
      .shot img { width: 100%; height: 100%; object-fit: contain; display: block; }
      /* A photo must show the whole bird, not a crop: let the image set its own height. */
      .shot.photo { aspect-ratio: auto; }
      .shot.photo img { object-fit: contain; height: auto; }
      .shot .none { color: var(--ink-soft); font-size: 13px; letter-spacing: 0.2em; }
      .shot .tag {
        position: absolute; left: 8px; bottom: 6px;
        font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
        color: var(--ink-soft); background: #f7f1e4cc; padding: 2px 6px; border-radius: 2px;
      }
      .names .zh { font-size: clamp(20px, 2vw, 27px); line-height: 1.2; }
      .names .en { font-size: clamp(13px, 1.3vw, 17px); color: var(--ink); margin-top: 2px; }
      .names .py { font-size: clamp(11px, 1.1vw, 13px); color: var(--ink-soft); letter-spacing: 0.06em; margin-top: 3px; }
      .foot {
        display: flex; justify-content: space-between; align-items: center; gap: 8px;
        font-size: 11px; color: var(--ink-soft);
        border-top: 1px dotted var(--rule); padding-top: 7px;
      }
      .foot > span:first-child { white-space: nowrap; }
      .foot .credit { max-width: 70%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .links { display: flex; gap: 8px; flex-wrap: wrap; }
      .links a, .links button {
        font-family: inherit; font-size: 11px; letter-spacing: 0.08em; text-decoration: none;
        border: 1px solid var(--rule); border-radius: 999px; padding: 3px 10px;
        background: transparent; color: var(--ink-soft); cursor: pointer;
      }
      /* Playback progress fills the play button from the left; --p is 0…1. The label
         is --ink, not --ink-soft, because --ink-soft on the --rule fill is 3.2:1. */
      .links .play {
        position: relative; overflow: hidden; color: var(--ink);
        background: linear-gradient(90deg, var(--rule) calc(var(--p, 0) * 100%), transparent 0);
      }
      .links a:hover, .links a:focus-visible,
      .links button:hover, .links button:focus-visible { color: var(--ink); border-color: var(--ink); }
      .links button:disabled { opacity: 0.4; cursor: default; }
      .links .drop:hover, .links .drop:focus-visible { color: #6d2b18; border-color: #c98b76; }

      /* ---- illustration frames: fugleramme's collage, packed by real size ----
         One A4 landscape sheet, sized in the page rather than in pixels: what the
         screen shows is the sheet that prints. Birds stand on a common baseline in
         a wrapped row, each drawn at --h (the server's body-mass weight) times
         BIRD_PERCENT of the sheet's height, biggest first. */
      .collage {
        /* fugleramme's own paper tone (paper.TARGET_PAPER) — the plates are aged
           cream, so the sheet they sit on is too, never a white box. */
        --sheet: #f2ede2;
        container-type: size;
        aspect-ratio: 297 / 210;
        width: min(100%, calc((100dvh - 190px) * 1.414));
        margin: auto;
        padding: 4%;
        display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: center;
        gap: 2% 2.5%;
        background: var(--sheet);
        box-shadow: 0 2px 10px rgba(44, 38, 32, 0.16);
      }
      .collage .cell {
        display: flex; flex-direction: column; align-items: center;
        /* max-content: a plate is never squeezed to fit, so it is never cropped. */
        width: max-content;
      }
      .collage .shot { display: flex; align-items: flex-end; justify-content: center; }
      .collage .shot img {
        /* --h 1 (the frame's biggest bird) is 26% of the sheet's height; three rows
           of that plus captions is what keeps twelve birds on one A4 page.
           No blend mode: the halo is already the sheet's own tone (onPaper), so
           there is nothing to blend, and what the screen shows is what prints. */
        height: calc(var(--h, 1) * 26cqh); width: auto;
      }
      .collage .hand {
        font-family: "Ma Shan Zheng", "Kaiti SC", "STKaiti", cursive;
        line-height: 1.25; text-align: center; color: var(--ink);
      }
      .collage .hand.en { font-size: 2.4cqh; margin-top: 0.4em; }
      .collage .hand.zh { font-size: 3.2cqh; }
      .frames { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; }
      .frames button, .frames span {
        font: inherit; font-size: clamp(12px, 1.2vw, 15px);
        padding: 7px 12px; border: 1px solid var(--rule); border-radius: 999px;
        background: var(--card); color: var(--ink);
      }
      .frames button { cursor: pointer; }
      .frames button:hover, .frames button:focus-visible { border-color: var(--ink); }
      .frames button:disabled { opacity: 0.4; cursor: default; }
      .frames span { border-color: transparent; background: transparent; color: var(--ink-soft); }

      /* The screen sheet IS the paper sheet: same box, same ratios, one A4 page. */
      @media print {
        @page { size: A4 landscape; margin: 0; }
        html, body { background: #fff; height: auto; }
        header, .controls, footer, .empty, .banner { display: none !important; }
        .sheet { max-width: none; padding: 0; min-height: 0; }
        main { display: block; }
        /* Same sheet, in millimetres: zero page margin, or the paper shrinks
           under the box and the collage spills onto a second page. */
        .collage {
          width: 297mm; height: 210mm; margin: 0; box-shadow: none;
          print-color-adjust: exact; -webkit-print-color-adjust: exact;
        }
        .collage .cell { break-inside: avoid; }
      }
      .empty {
        text-align: center; color: var(--ink-soft);
        padding: min(18vh, 120px) 20px; font-size: clamp(16px, 2vw, 24px);
      }
      .empty small { display: block; margin-top: 10px; font-size: 13px; letter-spacing: 0.2em; }
      .banner {
        margin: 0 0 12px; padding: 8px 14px; border-radius: 4px;
        background: #f6d9d0; border: 1px solid #c98b76; color: #6d2b18; font-size: 14px;
      }
      footer { color: var(--ink-soft); font-size: 11px; letter-spacing: 0.06em; }
      a { color: var(--accent); }
      @media (prefers-color-scheme: dark) {
        :root { color-scheme: dark; }
      }
    </style>
  </head>
  <body>
    <div class="sheet">
      <header>
        <h1>鸟语<small>Fugleramme · BirdNET-Go</small></h1>
        <div class="meta">
          <div><b id="species">–</b> species · <b id="calls">–</b> calls in <b id="window">24h</b></div>
          <div id="updated">–</div>
        </div>
      </header>

      <div class="controls">
        <div class="toggle" role="group" aria-label="Image style">
          <button id="mode-photo" aria-pressed="true">照片 Photo</button>
          <button id="mode-plate" aria-pressed="false">插画 Illustration</button>
        </div>
        <select id="hours" aria-label="Time window">
          <option value="6">近 6 小时 · 6h</option>
          <option value="24" selected>近 24 小时 · 24h</option>
          <option value="72">近 3 日 · 72h</option>
          <option value="168">近 7 日 · 7d</option>
        </select>
        <div class="frames" id="frames" hidden>
          <button id="frame-prev" title="上一帧 previous frame">◀</button>
          <span id="frame-label">第 1 / 1 帧</span>
          <button id="frame-next" title="下一帧 next frame">▶</button>
          <button id="frame-pdf" title="打印当前帧为 A4 PDF">⤓ A4 PDF</button>
        </div>
      </div>

      <main>
        <p id="banner" class="banner" hidden></p>
        <div id="grid" class="grid"></div>
        <div id="collage" class="collage"></div>
        <div id="empty" class="empty">
          <span id="empty-text">聆听中 — listening to the station</span>
          <small id="empty-sub">POLLING BIRDNET-GO</small>
        </div>
      </main>

      <footer>
        detections from a self-hosted BirdNET-Go ·
        plates: <a href="https://github.com/arnegiacomo/fugleramme" target="_blank" rel="noopener">fugleramme</a>
        (CC BY-SA 4.0) · photos &amp; 中文名: iNaturalist · bird sizes: AVONET
        (Tobias et al. 2022, CC BY 4.0)
      </footer>
    </div>

    <script type="module">
      const grid = document.getElementById("grid");
      const empty = document.getElementById("empty");
      const banner = document.getElementById("banner");
      const hoursEl = document.getElementById("hours");
      const collage = document.getElementById("collage");
      const framesEl = document.getElementById("frames");
      const frameLabel = document.getElementById("frame-label");
      const framePrev = document.getElementById("frame-prev");
      const frameNext = document.getElementById("frame-next");
      const framePdf = document.getElementById("frame-pdf");
      /* A frame is one A4 sheet: a collage of cut-outs, 12 to a page. */
      const PER_FRAME = 12;
      let frame = 0;

      // The frame is a picture frame: the chosen style sticks between visits.
      let mode = localStorage.getItem("fugleramme.mode") || "photo";
      let hours = Number(localStorage.getItem("fugleramme.hours")) || 24;
      let last = null;
      /* One <audio> for the whole page: a kiosk plays one call at a time. */
      let clip = null;

      hoursEl.value = String(hours);
      applyMode();

      function applyMode() {
        for (const m of ["plate", "photo"]) {
          document.getElementById(`mode-${m}`).setAttribute("aria-pressed", String(m === mode));
        }
        localStorage.setItem("fugleramme.mode", mode);
        render(last);
      }
      document.getElementById("mode-plate").onclick = () => { mode = "plate"; applyMode(); };
      document.getElementById("mode-photo").onclick = () => { mode = "photo"; applyMode(); };
      hoursEl.onchange = () => {
        hours = Number(hoursEl.value);
        localStorage.setItem("fugleramme.hours", String(hours));
        load();
      };

      const step = (n) => { frame = n; render(last); };
      framePrev.onclick = () => step(Math.max(0, frame - 1));
      frameNext.onclick = () => step(frame + 1);
      /* The print stylesheet hides everything but the current frame, so the
         browser's own "save as PDF" writes one A4 file per frame. */
      framePdf.onclick = () => window.print();


      const clock = (ms) =>
        new Date(ms).toLocaleString(undefined, {
          month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit",
        });
      const ago = (ms) => {
        const min = Math.round((Date.now() - ms) / 60000);
        if (min < 1) return "just now";
        if (min < 60) return `${min} min ago`;
        if (min < 60 * 24) return `${Math.round(min / 60)} h ago`;
        return `${Math.round(min / 1440)} d ago`;
      };

      // Only https URLs from Wikipedia/iNaturalist may reach href; anything else is dropped.
      const safeUrl = (u, host) => {
        try {
          const url = new URL(u);
          return url.protocol === "https:" && url.hostname.endsWith(host) ? url.href : null;
        } catch {
          return null;
        }
      };

      function card(bird) {
        const usePhoto = mode === "photo" && bird.photo;
        const src = usePhoto ? bird.photo : bird.plateUrl || bird.photo;
        const el = document.createElement("article");
        el.className = "bird";
        const label = bird.zh || bird.en;
        const credit = usePhoto ? bird.credit : bird.plateUrl ? "fugleramme" : bird.credit || "";
        const tag = !src ? "无图 no image" : usePhoto ? "photo" : bird.plateUrl ? "plate" : "photo fallback";
        const wiki = bird.wiki && safeUrl(bird.wiki.url, "wikipedia.org");
        const inat = bird.inat && safeUrl(bird.inat, "inaturalist.org");
        const playing = clip && clip.dataset.id === String(bird.id) && !clip.paused;
        el.innerHTML = `
          <div class="shot ${usePhoto ? "photo" : src ? "plate" : ""}">
            ${src ? `<img loading="lazy" src="${src}" alt="${label}" />` : `<span class="none">无图</span>`}
            <span class="tag">${tag}</span>
          </div>
          <div class="names">
            <div class="zh">${label}</div>
            ${bird.pinyin ? `<div class="py">${bird.pinyin}</div>` : ""}
            <div class="en">${bird.en}</div>
            <div class="sci">${bird.sci}</div>
          </div>
          <div class="foot">
            <span>×${bird.count} · ${ago(bird.last)} · ${Math.round(bird.confidence * 100)}%</span>
            <span class="credit" title="${bird.credit || ""}">${credit}</span>
          </div>
          <div class="links">
            <button class="play" ${bird.id ? "" : "disabled"}>${playing ? "⏸ 暂停 Pause" : "▶ 录音 Play"}</button>
            ${wiki ? `<a href="${wiki}" target="_blank" rel="noopener">${bird.wiki.lang === "zh" ? "维基百科" : "Wikipedia"}</a>` : ""}
            ${inat ? `<a href="${inat}" target="_blank" rel="noopener">iNaturalist</a>` : ""}
            ${bird.id ? `<button class="drop" title="删除这条误报记录">✕ 误报 false positive</button>` : ""}
          </div>`;
        const play = el.querySelector(".play");
        play.onclick = (e) => togglePlay(bird, e.currentTarget);
        // The 30 s poll replaces every card: hand the live clip's state to the new button.
        if (clip && clip.dataset.id === String(bird.id) && !clip.ended) showPlay(play, clip);
        const drop = el.querySelector(".drop");
        if (drop) drop.onclick = () => dropDetection(bird, drop);
        return el;
      }

      /* One collage cell: the cut-out alone on the page, captioned underneath.
         No photo fallback and no buttons — a species fugleramme has no plate
         for is left out of the illustration frame entirely, and the photo view
         stays the place to play or delete a call. */
      function cell(bird, weight) {
        const el = document.createElement("article");
        el.className = "cell";
        el.title = bird.sci;
        /* --h is the bird's size as a multiple of an average bird; CSS turns it
           into a fraction of the sheet's height, so screen and paper agree. */
        el.style.setProperty("--h", weight.toFixed(3));
        const url = bird.plateUrl;
        const img = new Image();
        img.loading = "lazy";
        img.alt = bird.zh || bird.en;
        img.src = url;
        img.addEventListener("load", () => { img.src = onPaper(url, img); }, { once: true });
        const el2 = document.createElement("div");
        el2.className = "shot";
        el2.append(img);
        el.append(el2, caption(bird.en), caption(bird.zh || "", "zh"));
        return el;
      }

      const caption = (text, kind = "en") => {
        const d = document.createElement("div");
        d.className = `hand ${kind}`;
        d.textContent = text;
        return d;
      };

      /* fugleramme normalises each plate's paper halo onto the page's own tone
         before pasting it (paper.process_sprite), which is why its sheets read
         as paper rather than as a wall of rectangles. Same algorithm, in a
         canvas, and it matters which way round it runs:

           1. measure the plate's OWN paper tone: the median colour of the
              opaque pixels beside its cut edge (its halo). Plates run from
              (240,236,230) to (232,217,196), so there is no fixed answer;
           2. the halo itself - the paper reachable from the cut edge through
              near-paper pixels - is painted PAPER flat. Shifting it by the
              difference between the two tones (fugleramme's smaller step) left
              the halo's own shading in place, and against a flat page that
              shading is the thing that reads as a pasted rectangle;
           3. paper that the ink walls off (between a bird's legs, under a
              tail) is only shifted, never flattened: it is part of the
              drawing, and it holds a pale bird's white plumage too, which a
              blanket "anything pale is paper" test repaints and eats;
           4. the transparent pixels get PAPER as well, so the soft edge of the
              cut-out reveals paper rather than whatever sat under the alpha.

         PAPER is fugleramme's TARGET_PAPER, and it must stay equal to the
         sheet's --sheet, or every plate reads as a rectangle again. Done once
         per plate; the 30 s poll reuses the result. PNG, not webp: the halo is
         a flat tone now, and a lossy re-encode stipples it. */
      const PAPER = [242, 237, 226];
      const RING = 8;      // px: how far out to look for the plate's cut edge
      const FLOOD = 25;    // levels: near enough to the halo tone to be paper
      const NEAR = 50;     // levels: near enough to shift (fugleramme's gate)
      const SAT = 55;      // levels: above this it is ink, never paper
      const BRIGHT = 160;  // levels: below this it is ink, never paper
      const SOLID = 128;   // alpha: below this the plate has no paper there
      const WORK = 900;    // px: longest side the paper pass runs at
      const flattened = new Map();

      function onPaper(url, img) {
        const cached = flattened.get(url);
        if (cached) return cached;
        const canvas = document.createElement("canvas");
        // Work at the size the plate is drawn, not the size it was scanned: a
        // plate is at most 26cqh of a 210mm sheet (54mm, ~640 px at 300 dpi),
        // while the scan is up to 1200 px - and every pass here is per pixel.
        const k = Math.min(1, WORK / Math.max(img.naturalWidth, img.naturalHeight));
        const w = canvas.width = Math.round(img.naturalWidth * k);
        const h = canvas.height = Math.round(img.naturalHeight * k);
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(img, 0, 0, w, h);
        const image = ctx.getImageData(0, 0, w, h);
        const { data } = image;
        const clear = (x, y) => data[(y * w + x) * 4 + 3] < SOLID;

        // 1. the halo tone, from the paper just inside the cut edge
        const r0 = [], g0 = [], b0 = [];
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const i = (y * w + x) * 4;
            if (data[i + 3] < SOLID) continue;
            const edge = x < RING || y < RING || x >= w - RING || y >= h - RING ||
              clear(x - RING, y) || clear(x + RING, y) || clear(x, y - RING) || clear(x, y + RING);
            if (!edge) continue;
            r0.push(data[i]); g0.push(data[i + 1]); b0.push(data[i + 2]);
          }
        }
        const median = (a) => { a.sort((p, q) => p - q); return a[a.length >> 1]; };
        const paper = r0.length > 50 ? [median(r0), median(g0), median(b0)] : PAPER;
        const delta = PAPER.map((t, c) => t - paper[c]);
        const near = (i, limit) => {
          const r = data[i], g = data[i + 1], b = data[i + 2];
          const hi = Math.max(r, g, b);
          if (hi <= BRIGHT || hi - Math.min(r, g, b) >= SAT) return false;
          return Math.max(Math.abs(r - paper[0]), Math.abs(g - paper[1]), Math.abs(b - paper[2])) < limit;
        };

        // 2. flood in from outside the plate through near-paper pixels: what it
        //    reaches is the halo. Seeded from a one-pixel frame around the plate,
        //    not from the cut itself - a cut whose alpha ramps over more than a
        //    few pixels has no pixel "next to transparent" to start from, which
        //    is how half these plates kept their scan paper. Same code covers a
        //    plate that was never cut out at all.
        const W = w + 2;
        const halo = new Uint8Array(W * (h + 2));
        const stack = [0];
        halo[0] = 1;
        while (stack.length) {
          const q = stack.pop();
          const qy = (q / W) | 0, qx = q - qy * W;
          for (let k = 0; k < 4; k++) {
            const n = k === 0 ? (qx > 0 ? q - 1 : -1)
              : k === 1 ? (qx < W - 1 ? q + 1 : -1)
              : k === 2 ? (qy > 0 ? q - W : -1)
              : (qy < h + 1 ? q + W : -1);
            if (n < 0 || halo[n]) continue;
            const ny = ((n / W) | 0) - 1, nx = (n - ((n / W) | 0) * W) - 1;
            if (nx >= 0 && ny >= 0 && nx < w && ny < h) {
              const a = data[(ny * w + nx) * 4 + 3];
              if (a >= SOLID && !near((ny * w + nx) * 4, FLOOD)) continue;
            }
            halo[n] = 1;
            stack.push(n);
          }
        }

        // 3. paint the halo flat, shift what the ink walls off, tone the void
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const p = y * w + x, i = p * 4;
            if (data[i + 3] < SOLID || halo[(y + 1) * W + x + 1]) {
              data[i] = PAPER[0]; data[i + 1] = PAPER[1]; data[i + 2] = PAPER[2];
              continue;
            }
            if (!near(i, NEAR)) continue;
            for (let c = 0; c < 3; c++) {
              data[i + c] = Math.max(0, Math.min(255, data[i + c] + delta[c]));
            }
          }
        }
        ctx.putImageData(image, 0, 0);
        const flat = canvas.toDataURL("image/png");
        flattened.set(url, flat);
        return flat;
      }

      /* The collage is drawn the way fugleramme draws it: biggest birds first,
         every bird scaled by `size` (body mass ** 0.14 x the plate's own slack)
         against the frame's biggest bird, so an eagle towers over a goldcrest. */
      function collageFrame(birds) {
        // Against the frame's biggest bird, not its mean: the tallest plate is
        // then always --h 1, which is what bounds the sheet to one A4 page.
        const max = Math.max(...birds.map((b) => b.size), 0) || 1;
        return [...birds]
          .sort((a, b) => b.size - a.size)
          .map((b) => cell(b, b.size / max));
      }

      /* The play button doubles as the progress bar: --p is 0…1, filled from the left. */
      function showPlay(btn, el) {
        // A finished clip empties the bar; a paused one keeps it, so you see where you stopped.
        btn.style.setProperty("--p", el.ended || !el.duration ? 0 : el.currentTime / el.duration);
        btn.textContent = el.paused || el.ended ? "▶ 录音 Play" : "⏸ 暂停 Pause";
      }

      function togglePlay(bird, btn) {
        if (clip && clip.dataset.id === String(bird.id)) {
          clip.paused ? clip.play() : clip.pause();
          showPlay(btn, clip);
          return;
        }
        clip?.pause();
        const el = new Audio(`/api/audio/${bird.id}`);
        clip = el;
        el.dataset.id = String(bird.id);
        el.addEventListener("timeupdate", () => showPlay(btn, el));
        el.addEventListener("loadedmetadata", () => showPlay(btn, el));
        el.addEventListener("ended", () => showPlay(btn, el));
        el.addEventListener("error", () => {
          btn.textContent = "无录音 no clip";
          btn.style.setProperty("--p", 0);
          btn.disabled = true;
        });
        showPlay(btn, el);
        el.play().then(() => showPlay(btn, el)).catch(() => { btn.textContent = "▶ 录音 Play"; });
      }

      async function dropDetection(bird, btn) {
        if (!confirm(`删除误报？Delete this ${bird.sci} detection from BirdNET-Go?`)) return;
        btn.disabled = true;
        try {
          const res = await fetch(`/api/detection/${bird.id}`, { method: "DELETE" });
          const body = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(body.error || res.status);
          clip?.pause();
          load();
        } catch (err) {
          btn.disabled = false;
          banner.hidden = false;
          banner.textContent = `delete failed: ${err.message}`;
        }
      }

      function render(data) {
        last = data;
        const birds = data ? data.birds : [];
        const plate = mode === "plate";
        // The illustration frame shows only what fugleramme actually drew.
        const drawn = plate ? birds.filter((b) => b.plateUrl) : birds;
        const frames = Math.max(1, Math.ceil(drawn.length / PER_FRAME));
        frame = Math.min(Math.max(frame, 0), frames - 1);
        grid.hidden = plate;
        collage.hidden = !plate;
        framesEl.hidden = !plate;
        framePrev.disabled = frame === 0;
        frameNext.disabled = frame >= frames - 1;
        frameLabel.textContent = `第 ${frame + 1} / ${frames} 帧`;
        grid.replaceChildren(...(plate || !data ? [] : birds.map(card)));
        collage.replaceChildren(
          ...collageFrame(drawn.slice(frame * PER_FRAME, (frame + 1) * PER_FRAME)),
        );
        empty.hidden = !data || drawn.length > 0;
        if (data) {
          document.getElementById("species").textContent = birds.length;
          document.getElementById("calls").textContent =
            birds.reduce((n, b) => n + b.count, 0);
          document.getElementById("window").textContent = `${data.windowHours}h`;
          document.getElementById("updated").textContent =
            data.stale ? "detector offline — showing last frame" : `updated ${clock(Date.parse(data.generatedAt))}`;
          banner.hidden = !data.stale;
          banner.textContent = data.stale ? "BirdNET-Go is not answering; holding the last frame." : "";
          if (!birds.length) {
            document.getElementById("empty-text").textContent = "静悄悄 — no birds heard";
            document.getElementById("empty-sub").textContent = "THE PERCH IS BARE";
          }
        }
      }

      async function load() {
        try {
          const res = await fetch(`/api/frame?hours=${hours}`, { cache: "no-store" });
          const body = await res.json();
          if (!res.ok) throw new Error(body.error || res.status);
          render(body);
        } catch (err) {
          document.getElementById("updated").textContent = `detector error: ${err.message}`;
          if (!last) {
            document.getElementById("empty-text").textContent = "听不到 — detector not answering";
            document.getElementById("empty-sub").textContent = String(err.message).slice(0, 120);
          }
        }
      }

      load();
      setInterval(load, 30000);
      document.addEventListener("visibilitychange", () => !document.hidden && load());
    </script>
  </body>
</html>
