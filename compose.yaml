services:
  fugleramme-web:
    # :latest is fine on first install. To get new images on redeploy, pin the commit
    # tag instead (ghcr.io/dakai/fugleramme-web:<full-commit-sha>) — a changed image
    # reference is what makes compose fetch again.
    image: ghcr.io/dakai/fugleramme-web:latest
    ports:
      - "8090:8090"
    environment:
      # Service name if BirdNET-Go runs in this same stack, otherwise the host:
      BIRDNA_URL: http://host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
    restart: unless-stopped
