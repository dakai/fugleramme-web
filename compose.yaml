services:
  fugleramme-web:
    image: ghcr.io/dakai/fugleramme-web:latest
    ports:
      - "8090:8090"
    environment:
      # Service name if BirdNET-Go runs in this same stack, otherwise the host:
      BIRDNA_URL: http://host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
    restart: unless-stopped
